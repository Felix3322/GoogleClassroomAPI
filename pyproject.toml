[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "GoogleClassroomAPI"
version = "0.1.0"
description = "Run Google Classroom the way a teacher thinks about it — courses, students, topics, assignments — using only the teacher's browser cookies."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Felix Liu" }]
keywords = ["google-classroom", "google-forms", "education", "reverse-engineering"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Education",
]
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
# The runtime needs only httpx. google-auth-oauthlib is used solely for the
# one-time interactive consent that mints the first refresh token; after that
# the library refreshes tokens itself over httpx, with no extra dependency.
oauth = ["google-auth-oauthlib>=1.2"]
dev = ["pytest>=8", "google-auth-oauthlib>=1.2"]

[tool.hatch.build.targets.wheel]
packages = ["src/google_classroom_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
